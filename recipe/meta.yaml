{% set name = "maketables" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0db51b7efa1e6ed8b1aedcd0537d8692ea8699ed08557e1871a5413a374c7058

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - numpy >=1.20.0
    - pandas >=1.3.0
    - great_tables >=0.2.0
    - tabulate >=0.9.0
    - python-docx >=0.8.11
    - ipython >=7.0.0

test:
  imports:
    - maketables
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://github.com/py-econometrics/maketables
  summary: Publication-ready tables from regression results, descriptive statistics, and balance tables
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://py-econometrics.github.io/maketables/
  dev_url: https://github.com/py-econometrics/maketables

extra:
  recipe-maintainers:
    - s3alfisc
